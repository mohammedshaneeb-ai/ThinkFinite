<style>
:root{
  --accent:#8A2BE1; --ink:#141414; --muted:#6b6478; --lav:#F1E8FC; --lav2:#E4D3F8;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --gap:clamp(12px,3vw,40px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased;
  background:#fff;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}

.card{
  position:relative; width:100%; height:100%;
  background:#fff; overflow:hidden;
  display:grid; grid-template-columns:1fr 1.15fr; animation:in .9s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Soft lavender wave behind the illustration */
.wave{position:absolute;right:0;top:0;height:100%;width:62%;pointer-events:none}

.logo{position:absolute;top:clamp(22px,3.5vw,44px);left:clamp(24px,4.5vw,64px);z-index:2;display:block}
.logo svg{height:clamp(20px,2vw,26px);width:auto;display:block}

.copy{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(24px,2vw,24px) 0 clamp(24px,4.5vw,64px)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(138,43,225,.55)}70%{box-shadow:0 0 0 10px rgba(138,43,225,0)}100%{box-shadow:0 0 0 0 rgba(138,43,225,0)}}
h1{margin:0;font-weight:700;font-size:clamp(34px,4.4vw,62px);line-height:1.04;letter-spacing:-.03em}
h1 em{display:block;font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent);letter-spacing:-.01em}
p.desc{margin:24px 0 0;max-width:440px;font-size:clamp(15px,1.3vw,18px);line-height:1.65;color:var(--muted)}

.art{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:clamp(16px,3vw,40px);min-height:0}
.art svg{width:100%;height:100%;max-height:100%}

/* Illustration motion */
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.spin.rev{animation-direction:reverse;animation-duration:10s}
@keyframes spin{to{transform:rotate(360deg)}}
.lift{animation:lift 3.2s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translateY(-12px)}50%{transform:translateY(0)}}
.paint{animation:paint 1.6s ease-in-out infinite}
@keyframes paint{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}

/* Mobile: stack, still one screen */
@media (max-width:820px){
  .card{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100%}
  .wave{width:100%;height:60%;top:auto;bottom:0}
  .copy{padding:clamp(76px,14vh,110px) 24px 0;justify-content:flex-start}
  .eyebrow{margin-bottom:14px}
  p.desc{margin-top:14px}
  .art{padding:12px 16px 20px}
}
@media (max-height:520px) and (min-width:821px){ h1{font-size:34px} p.desc{margin-top:14px;font-size:15px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
